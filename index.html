<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loomline – Fashion store</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--sf:#fff;--ink:#2B2420;--mu:#6F655E;--ln:#E6DFD8;--br:#8A6A5A;--onbr:#fff;--yl:#FFDF7E;--onyl:#2B2420;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "DM Sans",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
h1,h2,h3,.logo{font-family:"Cormorant Garamond",Georgia,serif;margin:0;line-height:1.05;font-weight:600}
button,input,select{font:inherit;color:inherit}a{color:inherit}
:focus-visible{outline:3px solid var(--yl);outline-offset:2px}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf)}
.tr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;height:64px}
.sb{display:flex;max-width:240px;border:1px solid var(--ln);border-radius:999px;overflow:hidden;background:var(--bg)}
.sb input{border:0;background:none;padding:8px 14px;width:100%;min-width:0}
.logo{font-size:2rem;text-decoration:none;letter-spacing:.04em}
.ic{display:flex;gap:8px;justify-content:flex-end}
.ib{background:none;border:0;cursor:pointer;padding:8px;border-radius:10px;font-weight:600}
.nv{background:var(--br);color:var(--onbr)}
.nv .w{display:flex;gap:22px;align-items:center;height:42px;overflow-x:auto;white-space:nowrap}
.nv a{text-decoration:none;font-weight:500}.nv .sp{margin-left:auto;font-size:.85rem;opacity:.9}
@media(max-width:640px){.tr{grid-template-columns:auto 1fr}.logo{grid-column:1}.sb{display:none}.nv .sp{display:none}}
.hero{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:16px;margin:24px 0;height:400px}
.bn{border-radius:6px;padding:28px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative;overflow:hidden}
.bn::after{content:attr(data-e);position:absolute;right:6%;bottom:-6%;font-size:9rem;opacity:.9}
.bn.a{grid-row:span 2;background:linear-gradient(120deg,#4A3A33,#8A6A5A)}.bn.b{background:#3B3A3F}.bn.c{background:#6B4B3C}
.bn h1{font-size:clamp(2.4rem,5vw,3.8rem)}.bn h2{font-size:1.9rem}
.ghost{align-self:flex-start;border:1px solid #fff;color:#fff;padding:9px 22px;text-decoration:none;border-radius:4px;position:relative;z-index:1}
@media(max-width:760px){.hero{grid-template-columns:1fr;grid-template-rows:auto;height:auto}.bn.a{grid-row:auto;min-height:260px}.bn.b,.bn.c{min-height:150px}}
.lay{display:grid;grid-template-columns:240px 1fr;gap:24px;margin:40px 0}
@media(max-width:820px){.lay{grid-template-columns:1fr}}
.side{border:1px solid var(--ln);background:var(--sf);align-self:start}
.side h3{padding:14px 16px;font-size:1.2rem;border-bottom:1px solid var(--ln)}
.ts{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 16px;align-items:center}
.th{width:56px;height:56px;display:grid;place-items:center;font-size:1.7rem;border:1px solid var(--ln)}
.hd{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--ln);margin-bottom:18px;flex-wrap:wrap;gap:8px}
.hd h2{font-size:1.7rem;padding-bottom:6px}.tabs{display:flex;gap:18px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:4px 0;cursor:pointer;color:var(--mu)}
.tabs button[aria-pressed="true"]{color:var(--br);border-color:var(--br);font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.card{border:1px solid var(--ln);background:var(--sf);display:flex;flex-direction:column}
.pic{aspect-ratio:1;display:grid;place-items:center;font-size:5rem}
.info{padding:14px;display:flex;flex-direction:column;gap:8px;text-align:center;flex:1}
.info h3{font-size:1.15rem;font-family:"DM Sans";font-weight:500}.info s{color:var(--mu)}.info b{color:var(--br)}
.btn{background:var(--br);color:var(--onbr);border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:700;margin-top:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}
.yl{background:var(--yl);color:var(--onyl);border:0;border-radius:12px;padding:14px;width:100%;font-weight:700;cursor:pointer}
.sec{background:none;border:1px solid var(--ln);border-radius:6px;padding:6px 12px;cursor:pointer}
.split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--ln);background:var(--sf);margin:32px 0}
.split>.l{background:#E9E6E2;display:grid;place-items:center;font-size:9rem;min-height:260px;padding:20px}
.split>.l.sum{display:block;font-size:1rem;background:var(--bg);padding:32px}
.split>.r{padding:40px clamp(20px,6vw,64px)}
@media(max-width:760px){.split{grid-template-columns:1fr}}
.r h1{font-size:2.6rem;text-align:center;margin-bottom:8px}.r .sub{text-align:center;color:var(--mu);margin:0 0 24px}
.fl{display:block;font-weight:700;font-size:.85rem;margin:14px 0 6px}
.in{width:100%;border:1px solid var(--ln);border-radius:12px;padding:12px 14px;background:var(--sf)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.r .yl{margin-top:22px}
.sl{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--ln)}
.tw{overflow-x:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.st{border:1px solid var(--ln);background:var(--sf);padding:16px}.st b{display:block;font-size:1.6rem;font-family:"Cormorant Garamond",serif}
.af{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;align-items:end;margin:16px 0}
.scr{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}.scr.on{opacity:1;pointer-events:auto}
.dr{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--sf);z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}.dr.on{transform:none}
.dr .hd{padding:16px 20px;margin:0}.dr .it{flex:1;overflow:auto;padding:0 20px}.dr .ft{padding:16px 20px;border-top:1px solid var(--ln)}
.cl{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--ln)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;text-align:center;max-width:90%}.toast.on{opacity:1;transform:translate(-50%,0)}
footer{border-top:1px solid var(--ln);padding:24px 0 40px;color:var(--mu);text-align:center}footer a{margin:0 12px;text-decoration:none}footer a:hover{text-decoration:underline}footer p{margin:12px 0 0}
.pg{margin:40px 0}.pg h1{font-size:2.8rem;text-align:center;margin-bottom:8px}.pg .sub{text-align:center;color:var(--mu);margin:0 0 28px}.tx{max-width:68ch;margin:0 auto}.tx h2{font-size:1.5rem;margin:24px 0 6px}.tx p{margin:0 0 12px}details{border-bottom:1px solid var(--ln);padding:12px 0}summary{cursor:pointer;font-weight:700}details p{margin:8px 0 0;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header class="top"><div class="w tr">
<div class="sb"><input id="q" placeholder="Search products" aria-label="Search products"></div>
<a class="logo" href="#home">LOOMLINE</a>
<div class="ic"><a class="ib" href="#account" id="who">Sign in</a><button class="ib" data-a="cart" aria-label="Open cart">Cart (<span id="n">0</span>)</button></div>
</div>
<nav class="nv"><div class="w"><a href="#home">Home</a><a href="#collection">Shop</a><a href="#women">Women</a><a href="#men">Men</a><a href="#accessories">Accessories</a><a href="#about">About</a><a href="#contact">Contact</a><a href="#admin">Admin</a><span class="sp">Free shipping on orders over $60</span></div></nav></header>
<main class="w" id="app"></main>
<footer><nav aria-label="Footer"><a href="#about">About us</a><a href="#contact">Contact</a><a href="#shipping">Shipping and returns</a><a href="#faq">FAQ</a><a href="#privacy">Privacy</a></nav><p>© 2026 Loomline · Demo store</p></footer>
<div class="scr" id="scr"></div>
<aside class="dr" id="dr" aria-hidden="true"><div class="hd"><h2>Your cart</h2><button class="ib" data-a="close" aria-label="Close cart">✕</button></div><div class="it" id="it"></div>
<div class="ft"><div class="sl"><b>Subtotal</b><b id="sub"></b></div><br><button class="yl" id="go">Go to checkout</button></div></aside>
<div class="toast" id="toast" role="status"></div>
<script>
const $=i=>document.getElementById(i),m=n=>"$"+Number(n).toFixed(2);
let S={p:[
{id:1,name:"Cropped knit sweater",cat:"Women",price:39,old:52,e:"🧶",bg:"#EADFD6",stock:14,tag:"featured"},
{id:2,name:"Floral two-piece set",cat:"Women",price:45,old:60,e:"👗",bg:"#F2D7D3",stock:9,tag:"featured"},
{id:3,name:"Leather tote bag",cat:"Accessories",price:79,old:99,e:"👜",bg:"#CDBBAE",stock:6,tag:"best"},
{id:4,name:"Everyday sneakers",cat:"Men",price:68,old:85,e:"👟",bg:"#DDE3E6",stock:20,tag:"featured"},
{id:5,name:"Shearling jacket",cat:"Men",price:120,old:160,e:"🧥",bg:"#D8C3B0",stock:5,tag:"latest"},
{id:6,name:"Wool beanie",cat:"Accessories",price:18,old:26,e:"🧢",bg:"#E6CE9B",stock:30,tag:"best"},
{id:7,name:"Slim chino trousers",cat:"Men",price:49,old:64,e:"👖",bg:"#D6CFC4",stock:12,tag:"latest"},
{id:8,name:"Summer slip dress",cat:"Women",price:42,old:55,e:"👗",bg:"#F0DCE0",stock:0,tag:"best"}],
o:[],cart:[],u:null,adm:false,tab:"dash",ed:null,q:"",th:"featured",cat:""};
try{const d=JSON.parse(localStorage.getItem("ll")||"null");if(d&&d.p){S.p=d.p;S.o=d.o||[]}}catch(e){}
const save=()=>{try{localStorage.setItem("ll",JSON.stringify({p:S.p,o:S.o}))}catch(e){}};
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2400)};
const P=id=>S.p.find(p=>p.id==id),tot=()=>S.cart.reduce((a,l)=>a+l.q*P(l.id).price,0);
const card=p=>`<article class="card"><div class="pic" style="background:${p.bg}">${p.e}</div><div class="info"><h3>${p.name}</h3><div><s>${m(p.old)}</s> <b>${m(p.price)}</b></div><button class="btn" data-a="add" data-id="${p.id}" ${p.stock<1?"disabled":""}>${p.stock<1?"Sold out":"Add to cart"}</button></div></article>`;
function home(){
 let l=S.p;const q=S.q.toLowerCase();
 if(q)l=l.filter(p=>p.name.toLowerCase().includes(q));else if(S.cat)l=l.filter(p=>p.cat===S.cat);else l=l.filter(p=>p.tag===S.th);
 const top=S.p.filter(p=>p.tag==="best").slice(0,3);
 return`<section class="hero"><div class="bn a" data-e="🧥"><h1>Trendy fashion clothes</h1><p>New spring collection, up to 30% off</p><a class="ghost" href="#shop">Shop now</a></div>
 <div class="bn b" data-e="👗"><h2>25% off everything</h2><a class="ghost" href="#shop">Shop now</a></div><div class="bn c" data-e="🧣"><h2>Men’s collection</h2><a class="ghost" href="#men">Shop now</a></div></section>
 <section class="lay" id="shop"><aside class="side"><h3>Top sellers</h3>${top.map(p=>`<div class="ts"><div class="th" style="background:${p.bg}">${p.e}</div><div>${p.name}<br><b style="color:var(--br)">${m(p.price)}</b></div></div>`).join("")}</aside>
 <div><div class="hd"><h2>${S.cat||"We love trend"}</h2><div class="tabs">${["featured","latest","best"].map(t=>`<button data-a="tab" data-t="${t}" aria-pressed="${t===S.th&&!S.cat}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div></div>
 <div class="g">${l.map(card).join("")||"<p>No products match your search.</p>"}</div></div></section>`}
function account(){
 if(S.u)return`<div class="split"><div class="l">👋</div><div class="r"><h1>Hi, ${S.u}</h1><p class="sub">You’re signed in.</p><button class="yl" data-a="out">Sign out</button></div></div>`;
 return`<div class="split"><div class="l">🧥</div><div class="r"><h1>Create an account</h1><p class="sub">Free shipping, 30-day returns and savings on future orders.</p>
 <form id="fa"><label class="fl" for="em">Email</label><input class="in" id="em" type="email" required placeholder="Enter email">
 <label class="fl" for="pw">Password</label><input class="in" id="pw" type="password" required minlength="6" placeholder="Create a password">
 <button class="yl">Create account</button></form></div></div>`}
function checkout(){
 if(!S.cart.length)return`<div class="split"><div class="l">🛍️</div><div class="r"><h1>Your cart is empty</h1><p class="sub">Add something first.</p><a href="#home"><button class="yl">Back to shop</button></a></div></div>`;
 return`<div class="split"><div class="l sum"><h2>Order summary</h2><br>${S.cart.map(l=>{const p=P(l.id);return`<div class="sl"><span>${p.e} ${p.name} × ${l.q}</span><span>${m(l.q*p.price)}</span></div>`}).join("")}<div class="sl"><b>Total</b><b>${m(tot())}</b></div></div>
 <div class="r"><h1>Payment</h1><p class="sub">Card details are used only to place this demo order and are never saved.</p>
 <form id="fp"><label class="fl" for="nm">Full name</label><input class="in" id="nm" required value="${S.u||""}">
 <label class="fl" for="ad">Delivery address</label><input class="in" id="ad" required>
 <label class="fl" for="cn">Card number</label><input class="in" id="cn" required inputmode="numeric" placeholder="4242 4242 4242 4242" pattern="[0-9 ]{12,23}">
 <div class="two"><div><label class="fl" for="ex">Expiry</label><input class="in" id="ex" required placeholder="MM/YY" pattern="[0-9]{2}/[0-9]{2}"></div><div><label class="fl" for="cv">CVC</label><input class="in" id="cv" required inputmode="numeric" pattern="[0-9]{3,4}"></div></div>
 <button class="yl">Pay ${m(tot())}</button></form></div></div>`}
function admin(){
 if(!S.adm)return`<div class="split"><div class="l">🔒</div><div class="r"><h1>Admin</h1><p class="sub">Enter the admin password. Demo password: admin123</p><form id="fl"><input class="in" id="ap" type="password" required aria-label="Admin password"><button class="yl">Sign in</button></form></div></div>`;
 const rev=S.o.reduce((a,o)=>a+o.total,0),low=S.p.filter(p=>p.stock<=5).length,e=S.ed?P(S.ed):{};
 const tabs=["dash","products","orders"].map(t=>`<button class="sec" data-a="at" data-t="${t}" aria-pressed="${S.tab===t}" ${S.tab===t?'style="background:var(--br);color:var(--onbr)"':""}>${{dash:"Dashboard",products:"Products",orders:"Orders"}[t]}</button>`).join(" ");
 let b="";
 if(S.tab==="dash")b=`<div class="stats"><div class="st">Revenue<b>${m(rev)}</b></div><div class="st">Orders<b>${S.o.length}</b></div><div class="st">Products<b>${S.p.length}</b></div><div class="st">Low stock (5 or fewer)<b>${low}</b></div></div>`;
 if(S.tab==="products")b=`<form class="af" id="pf"><div><label class="fl">Name</label><input class="in" id="pn" required value="${e.name||""}"></div><div><label class="fl">Category</label><select class="in" id="pc">${["Women","Men","Accessories"].map(c=>`<option ${e.cat===c?"selected":""}>${c}</option>`).join("")}</select></div><div><label class="fl">Price</label><input class="in" id="pp" type="number" step="0.01" min="0" required value="${e.price??""}"></div><div><label class="fl">Stock</label><input class="in" id="ps" type="number" min="0" required value="${e.stock??""}"></div><div><label class="fl">Emoji</label><input class="in" id="pe" maxlength="4" value="${e.e||"👕"}"></div><button class="btn">${S.ed?"Save changes":"Add product"}</button></form>
 <div class="tw"><table><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr>${S.p.map(p=>`<tr><td>${p.e} ${p.name}</td><td>${p.cat}</td><td>${m(p.price)}</td><td>${p.stock}</td><td><button class="sec" data-a="ed" data-id="${p.id}">Edit</button> <button class="sec" data-a="del" data-id="${p.id}">Delete</button></td></tr>`).join("")}</table></div>`;
 if(S.tab==="orders")b=S.o.length?`<div class="tw"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>${S.o.map((o,i)=>`<tr><td>${o.id}<br><small>${o.date}</small></td><td>${o.name}</td><td>${o.n}</td><td>${m(o.total)}</td><td><select data-a="st" data-i="${i}" aria-label="Status for ${o.id}">${["Paid","Packed","Shipped","Delivered"].map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}</select></td></tr>`).join("")}</table></div>`:"<p>No orders yet. Orders placed at checkout appear here.</p>";
 return`<section style="margin:32px 0"><div class="hd"><h2>Admin panel</h2><div>${tabs} <button class="sec" data-a="lo">Log out</button></div></div>${b}</section>`}
function cartUI(){
 $("n").textContent=S.cart.reduce((a,l)=>a+l.q,0);$("sub").textContent=m(tot());$("go").disabled=!S.cart.length;
 $("it").innerHTML=S.cart.length?S.cart.map((l,i)=>{const p=P(l.id);return`<div class="cl"><div class="th" style="background:${p.bg};width:48px;height:48px">${p.e}</div><div>${p.name}<br><button class="sec" data-a="dec" data-i="${i}">−</button> ${l.q} <button class="sec" data-a="inc" data-i="${i}">+</button></div><b>${m(l.q*p.price)}</b></div>`}).join(""):"<p>Your cart is empty.</p>"}
const page=(t,sub,body)=>`<section class="pg"><h1>${t}</h1><p class="sub">${sub}</p>${body}</section>`;
const catPg=(c,t,sub)=>()=>page(t,sub,`<div class="g">${S.p.filter(p=>p.cat===c).map(card).join("")||"<p>No products in this category yet.</p>"}</div>`);
const PG={
 women:catPg("Women","Women","Knitwear, dresses and everyday sets."),
 men:catPg("Men","Men","Jackets, trousers and shoes built to last."),
 accessories:catPg("Accessories","Accessories","Bags, hats and small finishing touches."),
 collection:()=>page("The full collection","Everything currently in the shop.",`<div class="g">${S.p.map(card).join("")}</div>`),
 about:()=>page("About us","A small range, made to be worn on repeat.",`<div class="tx"><p>Loomline started with a simple idea: fewer pieces, chosen with care. Every item is checked for fit, colour fade and shrinkage before it goes on sale.</p><h2>What we care about</h2><p>Honest prices, clear sizing and clothes that still look good after many washes. If something isn’t right, we’ll fix it.</p><h2>Visit or write to us</h2><p>Questions about an order or a style? Head to the <a href="#contact">contact page</a>.</p></div>`),
 contact:()=>page("Contact us","We reply within 2 working days.",`<div class="tx"><form id="fc"><label class="fl" for="cn1">Name</label><input class="in" id="cn1" required><label class="fl" for="ce">Email</label><input class="in" id="ce" type="email" required><label class="fl" for="cm">Message</label><textarea class="in" id="cm" rows="5" required></textarea><button class="yl" style="margin-top:22px">Send message</button></form><p style="margin-top:20px;color:var(--mu)">Or email hello@loomline.example</p></div>`),
 shipping:()=>page("Shipping and returns","Simple, fair and clearly stated.",`<div class="tx"><h2>Shipping</h2><p>Free standard shipping on orders over $60. Smaller orders ship for a flat fee shown at checkout. Orders are packed within 2 working days.</p><h2>Returns</h2><p>Not right? Send it back within 30 days, unworn and with tags, for a refund or exchange.</p><h2>Damaged or wrong item</h2><p>Contact us through the <a href="#contact">contact page</a> and we’ll arrange a replacement.</p></div>`),
 faq:()=>page("FAQ","Quick answers to common questions.",`<div class="tx"><details><summary>How do I choose a size?</summary><p>Pick the size from the menu on each product. If you’re between sizes, we suggest sizing up.</p></details><details><summary>When will my order arrive?</summary><p>Orders are packed within 2 working days. Delivery time depends on your address.</p></details><details><summary>Can I return something?</summary><p>Yes, within 30 days. See <a href="#shipping">shipping and returns</a>.</p></details><details><summary>Which payment methods do you accept?</summary><p>Major credit and debit cards.</p></details></div>`),
 privacy:()=>page("Privacy","How we handle your information.",`<div class="tx"><p>We collect only what we need to process your order: your name, address and email. Card details are used to take payment and are never stored by this site.</p><p>We don’t sell your information. To ask us to delete your data, use the <a href="#contact">contact page</a>.</p></div>`)
};
function render(){
 const v=(location.hash.slice(1)||"home");
 $("app").innerHTML=v==="account"?account():v==="checkout"?checkout():v==="admin"?admin():PG[v]?PG[v]():home();if(v!=="home"&&v!=="shop")scrollTo(0,0);
 $("who").textContent=S.u?S.u.split("@")[0]:"Sign in";cartUI()}
const dr=o=>{$("dr").classList.toggle("on",o);$("scr").classList.toggle("on",o);$("dr").setAttribute("aria-hidden",!o)};
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-c]");if(c){S.cat=c.dataset.c;S.q="";$("q").value=""}else if(e.target.closest(".logo,[href='#home']:not([data-c])")){S.cat=""}
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=+b.dataset.id,i=+b.dataset.i;
 if(a==="cart")dr(true);if(a==="close")dr(false);
 if(a==="add"){const l=S.cart.find(x=>x.id===id);const cur=l?l.q:0;if(cur>=P(id).stock)return toast("No more stock available");l?l.q++:S.cart.push({id,q:1});cartUI();toast(P(id).name+" added to cart");return}
 if(a==="inc"){if(S.cart[i].q<P(S.cart[i].id).stock)S.cart[i].q++}
 if(a==="dec"){if(--S.cart[i].q<1)S.cart.splice(i,1)}
 if(a==="tab"){S.th=b.dataset.t;S.cat=""}
 if(a==="out")S.u=null;if(a==="lo")S.adm=false;if(a==="at")S.tab=b.dataset.t;
 if(a==="ed")S.ed=id;
 if(a==="del"){S.p=S.p.filter(p=>p.id!==id);save();toast("Product deleted")}
 render()});
document.addEventListener("change",e=>{if(e.target.dataset.a==="st"){S.o[+e.target.dataset.i].status=e.target.value;save();toast("Order status updated")}});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target.id;
 if(f==="fa"){S.u=$("em").value;location.hash="home";toast("Account created. Welcome!")}
 if(f==="fc"){e.target.reset();toast("Message sent. We’ll reply within 2 working days.")}
 if(f==="fl"){if($("ap").value==="admin123"){S.adm=true;render()}else toast("Wrong password")}
 if(f==="fp"){const items=S.cart.reduce((a,l)=>a+l.q,0);S.o.unshift({id:"#"+(1001+S.o.length),name:$("nm").value,total:tot(),n:items,status:"Paid",date:new Date().toLocaleDateString()});
  S.cart.forEach(l=>P(l.id).stock-=l.q);S.cart=[];save();location.hash="home";toast("Payment received. Order placed!")}
 if(f==="pf"){const d={name:$("pn").value,cat:$("pc").value,price:+$("pp").value,stock:+$("ps").value,e:$("pe").value||"👕"};
  if(S.ed){Object.assign(P(S.ed),d);S.ed=null}else S.p.push({id:Date.now(),old:Math.round(d.price*1.3),bg:"#E6DFD8",tag:"latest",...d});save();render();toast("Saved")}});
$("q").addEventListener("input",e=>{S.q=e.target.value;if((location.hash.slice(1)||"home")!=="home")location.hash="home";else render()});
$("scr").onclick=()=>dr(false);$("go").onclick=()=>{dr(false);location.hash="checkout"};
document.addEventListener("keydown",e=>{if(e.key==="Escape")dr(false)});
window.addEventListener("hashchange",()=>{if(location.hash==="#shop"){history.replaceState(null,"","#home");render();$("shop")&&$("shop").scrollIntoView();return}render()});
render();
</script></body></html>
